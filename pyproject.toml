[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nihonviet"
version = "0.1.0"
description = "AI assistant that explains Japanese documents (visa, tax, contracts, invoices) to Vietnamese people living in Japan"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["pydantic>=2"]
keywords = ["japanese", "vietnamese", "translation", "wareki", "immigration", "claude"]

[project.optional-dependencies]
ai = ["anthropic>=2.10"]
dev = ["pytest>=8"]

[project.scripts]
nihonviet = "nihonviet.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nihonviet"]

[tool.pytest.ini_options]
pythonpath = ["src"]
